aid: twitter-x
name: Twitter/X
description: >-
  X (formerly Twitter) operates the X Developer Platform, giving developers
  programmatic access to the public conversation through the X API v2 —
  Posts, Users, Direct Messages, Lists, Spaces, Communities, Community Notes,
  Trends, News, Media, and real-time delivery via filtered/sample/firehose
  streams and webhooks (X Activity, Account Activity, Filtered Stream
  Webhooks). The platform runs credit-based Pay-Per-Use pricing with a
  Developer Console at console.x.com, first-party Python and TypeScript XDKs,
  the xurl CLI, a local Playground mock server, and an unusually deep
  agent-native surface: llms.txt, AGENTS.md, skill.md, and hosted MCP servers
  for both the API and its documentation.
